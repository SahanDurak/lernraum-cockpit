# Start: docker compose up --build   ->  http://localhost:8000
# Settings come from .env (copy .env.example). Ports are bound to 127.0.0.1 only.

x-app: &app
  build: .
  image: lernraum-cockpit:local
  init: true # forwards stop signals, so containers shut down at once
  env_file: .env
  environment:
    DATABASE_URL: postgresql://cockpit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cockpit
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  # Hardening: no extra privileges, no Linux capabilities, read-only filesystem.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_DB: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # for local development without Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
