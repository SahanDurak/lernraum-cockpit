name: Claude

# Mention @claude in a PR or issue (comment, review or issue text) to give Claude a task,
# e.g. "@claude review" for a re-review after new pushes.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Only the repo owner may trigger Claude (protects the Pro subscription quota), and only
    # on issues/PRs the owner authored: Claude runs with write access, so it must never read
    # foreign issue text or check out code from foreign fork PRs (prompt injection, token theft).
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' &&
          github.event.issue.user.login == github.repository_owner &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    # Job level (not workflow level): otherwise every unrelated comment would join the
    # group and replace a queued @claude run before the "if" above is evaluated.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      # Queue instead of cancel: a running task may already be changing code.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write, so @claude can push changes to its own claude/... branches.
      # main is protected by the ruleset "protect-main" (PR only, no bypass actors).
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 25
