version: 2
# Every ecosystem: minor and patch updates in one grouped PR per week;
# major updates come as single PRs (except the ignored ones below).
updates:
  # Keep the pinned action SHAs up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (time to spot compromised releases).
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node major is pinned on purpose (.nvmrc, engines); types follow that major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript majors need a deliberate migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Base images in the Dockerfile (node, python, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Same Node major as .nvmrc and engines; upgrade all of them together by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Images in docker-compose.yml (pgvector).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
